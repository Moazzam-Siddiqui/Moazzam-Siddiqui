name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *" # daily, ~11:47 IST
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "*.svg"

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Fetch data
        working-directory: scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python fetch_contributions.py
          python fetch_profile.py
      - name: Render SVGs
        working-directory: scripts
        run: python render_all.py
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            contrib-snake.svg?palette=github-dark&color_snake=#58d5e8
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: "data/*.json *.svg"
